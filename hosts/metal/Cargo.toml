# A workspace of its own: see the root manifest's `exclude`.
[workspace]

[package]
name = "gex-metal-page"
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
description = "The page's GPU Worker: WebMetal's executor on the browser's WebGPU, the ring the guest's Workers reach it by, and the display's canvas"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
webmetal-wire = { path = "../../third_party/WebMetal/wire" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
webmetal-host = { path = "../../third_party/WebMetal/host", features = ["web"] }
# The versions WebMetal's host pins; the wasm-bindgen CLI that post-processes the module must match.
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
wasm-bindgen-futures = "=0.4.55"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The compiler the executor builds with: the checks read the reference shader library with it.
airwgsl = { git = "https://github.com/BrowserPorts/AirWgsl", rev = "16e99622d3523693afd9541c1c9b90bb6962b0b1" }

# The GPU Worker checked from where a process's kernel stands (tests/check_page.py).
[[example]]
name = "check_task"
crate-type = ["cdylib"]

# WebMetal's host takes AirWgsl from its public repository at a commit of its
# own; the submodule, the commit the checks name, takes its place, so that the
# executor and the checks build with one compiler, as gexc's does.
[patch."https://github.com/BrowserPorts/AirWgsl"]
airwgsl = { path = "../../third_party/AirWgsl" }
