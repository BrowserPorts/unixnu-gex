[package]
name = "gex-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gex-kernel: the userspace Linux personality"

[dependencies]
gex-abi.workspace = true
# Atomic operations on guest words (PI futexes); the one unsafe view.
gex-atomic.workspace = true
gex-f80.workspace = true
# The SEP's core (ARMv7): its system-level model, which the core harness
# sets up for an AArch32 front end (`darwin::sep::core`).
gex-a32.workspace = true
# PE parsing and mapping for the NT personality.
gex-ld.workspace = true
# The code signature's digests: a CodeDirectory's cdhash.
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
# The Image4 manifests' RSA signatures (AppleImage4's evaluation).
num-bigint = { version = "0.4", default-features = false }
# A cryptex image's names compared and hashed as APFS does: in canonical
# decomposition (NFD).
unicode-normalization = { version = "0.1", default-features = false }

# The block store's format and allocator, shared with the page's offline editor.
gex-store.workspace = true

[dev-dependencies]
# Key pairs and signatures for the tests of the web device's chain and
# tickets (`darwin::webdevice`); the kernel itself only verifies.
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "getrandom", "sha2"] }

[features]
# Serve an x86-64 guest: its syscall numbers, struct layouts and signal frame.
x86 = ["gex-abi/x86"]
# Check the lock order (`sync::rank`) in a release build, as a debug build
# always does: the page shim cannot be built with debug assertions whole
# (core's own checks reject its guest-memory slices), so its order check is
# this switch (hosts/browser/build.sh: GEX_LOCK_RANKS=1).
lock-ranks = []
# A system call's time by phase (`phase`): a measuring build.
phases = []
