[package]
name = "gex-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GIR -> WebAssembly code generation and .gexm packaging"

[dependencies]
gex-abi.workspace = true
gex-ir.workspace = true

[features]
# Lift and generate code on every core. Off for the browser shim, which
# reaches this crate compiled to wasm where `std::thread::scope` is absent.
default = []
parallel = []
# A prototype, for measuring its cost: each Darwin access check also marks
# the first and last bytes' pages touched in a byte map
# (`gex_abi::TOUCH_MAP64`), what a page host would answer a task's
# footprint from.
touch-map = ["gex-abi/touch-map"]
